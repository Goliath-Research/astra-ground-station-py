# One workflow, two Ubuntu 24.04 runners (x86_64 and ARM64), plus Mojo.
# Both architecture jobs load database/schema and run the same pytest suite.
# The Mojo job runs inside Modular's published MAX container, which already
# contains the Mojo 1.1.0 compiler. CI does not pip-install or build Mojo.
# modular/max-nvidia-base:26.6.0 publishes linux/amd64 and linux/arm64, so
# both runners execute the same build and smoke tests.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: lint, type-check, pytest, schema (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://astra:astra@127.0.0.1:5432/astra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Mypy
        run: mypy
      - name: Load schema
        run: python -m astra.db.schema_loader
      - name: Pytest
        run: pytest

  mojo:
    name: mojo (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - name: Version, build, and test inside the MAX container
        run: |
          set -euo pipefail
          image="modular/max-nvidia-base:26.6.0@sha256:53a1f0b502e67f400b0bc3c4575fde73f84d468ea03b977eaad2ef6fcd303c31"
          docker run --rm --entrypoint bash \
            -v "$PWD":/work -w /work \
            "$image" \
            -lc 'set -euo pipefail
          mojo --version
          mkdir -p mojo/build
          mojo build mojo/bitpack.mojo -o mojo/build/bitpack
          ./mojo/build/bitpack
          mojo run -I mojo mojo/test_bitpack.mojo'
